<h1>Exercice 3</h1>
<div>
  <h3>Notas académicas</h3>
  <p>Refresca la pagina para ver una nueva nota.</p>
  <div class="resultado-nota"
       [ngClass]="{
       'suspenso': n < 5,
       'aprobado': n >= 5 && n < 9,
       'sobresaliente':n >= 9
       }">
    {{n}}
  </div>
</div>

<div class="mt-3">
  @if (n < 5) {
    <p>¡Necesitas estudiar mas</p>
  }
  @if (n >= 9) {
    <p>¡Excelente trabajo!</p>
  }
</div>
